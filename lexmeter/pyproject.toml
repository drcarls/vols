[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexmeter_fees"
version = "0.1.0"
description = "US drip and junk fee collector: step-indexed capture of mandatory fees in checkout flows"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The browser driver is optional so the analysis half of the package -- flags,
# rules, metrics, reports -- installs and runs anywhere.
capture = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
