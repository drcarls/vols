<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Georgia,serif">
<rect width="720" height="300" fill="#f6f4ef"/>
<text x="40" y="30" font-size="15" font-weight="bold" fill="#1b1e26">Suez 1956: finance as the binding constraint</text>
<text x="40" y="48" font-size="11" fill="#59606e">The clean contrast to 1905 - here finance unambiguously DID constrain a great power. The sterling run + denied IMF access forced the withdrawal.</text>
<line x1="50" y1="150" x2="690" y2="150" stroke="#c9c3b6" stroke-width="2"/>
<rect x="204" y="146" width="294" height="8" fill="#8a3b2e" opacity="0.15"/>
<text x="351" y="92" font-size="10" fill="#8a3b2e" text-anchor="middle" font-style="italic">the squeeze: reserves drain ~$279m; US withholds support</text>
<circle cx="63" cy="150" r="5" fill="#59606e"/>
<text x="63" y="110" font-size="10.5" fill="#59606e" text-anchor="middle" font-weight="bold">29 Oct</text>
<text x="63" y="172" font-size="9.5" fill="#333" text-anchor="middle">Anglo-French</text>
<text x="63" y="185" font-size="9.5" fill="#333" text-anchor="middle">ultimatum / Sinai</text>
<circle cx="204" cy="150" r="5" fill="#8a3b2e"/>
<text x="204" y="110" font-size="10.5" fill="#8a3b2e" text-anchor="middle" font-weight="bold">5 Nov</text>
<text x="204" y="172" font-size="9.5" fill="#333" text-anchor="middle">Port Said landings;</text>
<text x="204" y="185" font-size="9.5" fill="#333" text-anchor="middle">run on sterling</text>
<circle cx="344" cy="150" r="5" fill="#8a3b2e"/>
<text x="344" y="110" font-size="10.5" fill="#8a3b2e" text-anchor="middle" font-weight="bold">6 Nov</text>
<text x="344" y="172" font-size="9.5" fill="#333" text-anchor="middle">CEASEFIRE</text>
<text x="344" y="185" font-size="9.5" fill="#333" text-anchor="middle">US blocks IMF aid</text>
<circle cx="498" cy="150" r="5" fill="#2f4b7c"/>
<text x="498" y="110" font-size="10.5" fill="#2f4b7c" text-anchor="middle" font-weight="bold">3 Dec</text>
<text x="498" y="172" font-size="9.5" fill="#333" text-anchor="middle">Withdrawal</text>
<text x="498" y="185" font-size="9.5" fill="#333" text-anchor="middle">announced</text>
<circle cx="645" cy="150" r="5" fill="#2f4b7c"/>
<text x="645" y="110" font-size="10.5" fill="#2f4b7c" text-anchor="middle" font-weight="bold">10 Dec</text>
<text x="645" y="172" font-size="9.5" fill="#333" text-anchor="middle">IMF ~$1.3bn released;</text>
<text x="645" y="185" font-size="9.5" fill="#333" text-anchor="middle">US oil restored</text>
<text x="40" y="284" font-size="9" fill="#8f8a7f">Schematic sequence (not a price series): under Bretton Woods sterling was pegged ~$2.80; the pressure was on reserves and IMF access. Figures [VERIFY] vs Kunz / IMF history (Boughton).</text>
</svg>