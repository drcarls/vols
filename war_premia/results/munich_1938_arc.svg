<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Georgia,serif">
<rect width="680" height="380" fill="#f6f4ef"/>
<text x="60" y="26" font-size="15" font-weight="bold" fill="#1b1e26">Munich 1938: the Paris market cried wolf, then rallied on relief</text>
<text x="60" y="43" font-size="11" fill="#59606e">Schematic of the daily tone of Le Temps' Bourse report, Sept-Oct 1938. Direction is press-reported, not a price series.</text>
<line x1="70" y1="185" x2="640" y2="185" stroke="#cfc9bd" stroke-dasharray="2,3"/>
<text x="646" y="189" font-size="9.5" fill="#8f8a7f">neutral</text>
<polyline points="70,271 260,202 450,82 640,128" fill="none" stroke="#1b1e26" stroke-width="2.2"/>
<circle cx="70" cy="271" r="4" fill="#8a3b2e"/>
<text x="70" y="298" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">17 Sep</text>
<text x="70" y="313" font-size="9" fill="#59606e" text-anchor="middle">Berchtesgaden</text>
<text x="70" y="325" font-size="9" fill="#59606e" text-anchor="middle">"deception evidente"</text>
<circle cx="260" cy="202" r="4" fill="#59606e"/>
<text x="260" y="228" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">28 Sep</text>
<text x="260" y="243" font-size="9" fill="#59606e" text-anchor="middle">Hitler's speech parsed:</text>
<text x="260" y="255" font-size="9" fill="#59606e" text-anchor="middle">"rien d'irreparable"</text>
<circle cx="450" cy="82" r="4.5" fill="#2f4b7c"/>
<text x="450" y="70" font-size="10" fill="#2f4b7c" text-anchor="middle" font-weight="bold">30 Sep - relief rally</text>
<text x="450" y="108" font-size="9" fill="#59606e" text-anchor="middle">Munich Agreement;</text>
<text x="450" y="120" font-size="9" fill="#59606e" text-anchor="middle">"optimisme... avec eclat"</text>
<circle cx="640" cy="128" r="4" fill="#1b1e26"/>
<text x="640" y="154" font-size="10" fill="#333" text-anchor="end" font-weight="bold">8 Oct</text>
<text x="640" y="169" font-size="9" fill="#59606e" text-anchor="end">calm; awaiting</text>
<text x="640" y="181" font-size="9" fill="#59606e" text-anchor="end">Daladier's measures</text>
<text x="60" y="360" font-size="9" fill="#8f8a7f">Source: Le Temps Bulletin financier via Gallica (ALTO OCR). The 30 Sep FX anchor (franc rallied vs GBP/USD) is the one quantitative point; verify against page image.</text>
</svg>
