<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="Helvetica,Arial,sans-serif">
<rect width="560" height="380" fill="#fff"/>
<text x="70" y="26" font-size="15" font-weight="bold">New York's sign flips: call-money deviation</text>
<text x="70" y="44" font-size="11" fill="#555">Peak deviation from NY's own seasonal norm (points). Below 0 = calmer than usual.</text>
