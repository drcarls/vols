<line x1="70" y1="190.0" x2="530" y2="190.0" stroke="#ececec" stroke-width="1"/>
<text x="64" y="193.0" font-size="10" fill="#555" text-anchor="end">+1</text>
<line x1="70" y1="163.3" x2="530" y2="163.3" stroke="#ececec" stroke-width="1"/>
<text x="64" y="166.3" font-size="10" fill="#555" text-anchor="end">+2</text>
<line x1="70" y1="136.7" x2="530" y2="136.7" stroke="#ececec" stroke-width="1"/>
<text x="64" y="139.7" font-size="10" fill="#555" text-anchor="end">+3</text>
<line x1="70" y1="110.0" x2="530" y2="110.0" stroke="#ececec" stroke-width="1"/>
<text x="64" y="113.0" font-size="10" fill="#555" text-anchor="end">+4</text>
<line x1="70" y1="83.3" x2="530" y2="83.3" stroke="#ececec" stroke-width="1"/>
<text x="64" y="86.3" font-size="10" fill="#555" text-anchor="end">+5</text>
<rect x="127.5" y="216.7" width="115.0" height="71.7" fill="#2980b9"/>
