<text x="50" y="26" font-size="15" font-weight="bold" fill="#1b1e26">1939-40: the US rose on the war it could profit from, crashed on the war that threatened it</text>
<text x="50" y="43" font-size="11" fill="#59606e">S&amp;P 500 daily. The outbreak of WWII (Sept 1939) was a boom; the fall of France (May 1940) was a crash.</text>
