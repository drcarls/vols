<text x="352" y="89" font-size="9.5" fill="#8a3b2e" text-anchor="middle" font-weight="bold">Hormuz fear: +10%</text>
<text x="501" y="281" font-size="9.5" fill="#2f4b7c" text-anchor="middle" font-style="italic">response symbolic, strait open -&gt; below pre-crisis</text>
<text x="48" y="314" font-size="9" fill="#59606e" text-anchor="end">$62</text>
