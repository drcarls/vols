<text x="52" y="26" font-size="15" font-weight="bold" fill="#1b1e26">Iran, June 2025: the barrel priced the war, then unwound below where it began</text>
<text x="52" y="43" font-size="11" fill="#59606e">WTI crude, daily (FRED). Oil carried the entire signal; the S&amp;P made new highs throughout.</text>
