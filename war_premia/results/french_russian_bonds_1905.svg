<text x="58" y="26" font-size="15" font-weight="bold" fill="#1b1e26">French savers' war risk in 1905 was Russian: the Consolide on the Paris Bourse</text>
<text x="58" y="43" font-size="11" fill="#59606e">Russian Consolidated 4%, Le Temps. Driven by the REVOLUTION, not the war: peace rallies it, the December uprising crashes it.</text>
