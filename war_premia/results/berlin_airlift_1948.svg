<text x="52" y="392" font-size="9" fill="#8f8a7f">The blockade onset was a shrug; the airlift-period slide tracked the recession and the Truman upset. Pre-nuclear-parity, so priceable - and priced as low-probability. Source: S&amp;P 500 daily (Yahoo ^GSPC).</text>
