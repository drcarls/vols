<text x="52" y="26" font-size="15" font-weight="bold" fill="#1b1e26">Berlin Airlift 1948-49: the market rose into the blockade, ignored its lifting</text>
<text x="52" y="43" font-size="11" fill="#59606e">S&amp;P 500 daily, Feb 1948 - Jul 1949. A prolonged great-power standoff the market discounted as unlikely to go general.</text>
