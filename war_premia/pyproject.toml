[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "war-premia"
version = "0.1.0"
description = "Reproduce and extend Carls (2005): Rigobon-Sack war-risk premia in the Neal-Weidenmeier weekly rates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "neal-weidenmier",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
war-premia = "war_premia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
