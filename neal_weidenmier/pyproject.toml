[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neal-weidenmier"
version = "0.1.0"
description = "Loader for the Neal-Weidenmeier Gold Standard Database (weekly 1870-1914 interest/exchange rates), with correct pre-1900 date decoding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
