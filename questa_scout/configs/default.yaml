# questa_scout configuration
serp:
  # Bright Data SERP zone name (the token comes from BRIGHTDATA_API_TOKEN env var)
  zone: serp
  country: us
  language: en

scoring:
  # Granular model: components sum to ~100 only when maxed, so the hot tier
  # actually ranks (adoption is scaled by intensity 0..5, not a flat level).
  scope_weights: {in_scope: 30, likely_in_scope: 20, unknown: 6, out_of_scope: -100}
  sensitivity_weights: {4: 15, 3: 10, 2: 5, 1: 2, 0: 0}
  governance_weights: {none_found: 25, uncertain: 12, governed: 0}
  adoption_max: 30          # multiplied by intensity/5
  adoption_unknown: 5       # small floor when adoption can't be assessed
