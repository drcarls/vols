[project]
name = "milk-pricing"
version = "0.1.0"
description = "Walmart South Carolina milk pricing from Instacart via Bright Data"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
milk-pricing = "milk_pricing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
