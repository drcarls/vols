# Baseline momentum sleeve - the control portfolio for the IV conditioning study.
# Price momentum only. Independent of the valuation model, so this is the
# clean test bed for whether IV adds information.
#
# No IV anywhere: no valuation agent, no overlay, no quality gate. Variants in the
# study are built by layering IV on top of exactly this.

data:
  features_path: data/processed/features_study.parquet
  fundamentals_path: configs/fundamentals.example.yaml
  state_path: data/state/momentum_state.json

portfolio:
  top_k: 25
  min_holdings: 20
  max_stock_weight: 0.08
  min_durability: 0.0
  cost_bps: 10.0
  turnover_cap: 1.0
  rebalance_threshold: 0.01
  weighting: equal_weight

learning:
  agents: [momentum]
  temperature: 1.0
  hedge_eta: 0.03
  min_agent_weight: 0.05
  max_agent_weight: 0.50

valuation:
  enabled: false

tax:
  status: tax_deferred

backtest:
  frequency: monthly
  rebalance_days: 21
  min_rebalances: 3

risk:
  max_drawdown_limit: -0.40
