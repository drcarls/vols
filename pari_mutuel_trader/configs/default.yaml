data:
  features_path: data/processed/features.parquet
  state_path: data/state/dashboard_state.json
  positions_path: configs/positions.example.yaml
portfolio:
  top_k: 25
  min_holdings: 20
  max_stock_weight: 0.05
  turnover_cap: 0.40
  rebalance_threshold: 0.01
  weighting: equal_weight
valuation:
  enabled: true
  required_return: 0.15      # IV15 - the price that buys a 15% return
  hold_return: 0.08          # IV8 - past this the business stops earning its keep
  add_margin: 0.02           # extra return demanded before adding back
  rich_band: 0.15            # tolerance past IV8 before a name is called expensive
  conviction_weight: 0.08    # ceiling for spring-loaded names
  core_weight: 0.06          # ceiling for names between IV15 and IV8
  house_money_weight: 0.03   # stake kept in a rich but durable franchise
  exit_durability: 0.45      # below this, a rich name is sold outright
  redeploy_horizon_years: 5.0
  switch_hurdle: 0.02        # margin an alternative must clear after tax
  long_term_wait_days: 45
  # "absolute" reads the weights above as portfolio percentages, for a concentrated
  # book. "relative" scales the multiples below off the sleeve's natural position
  # size (1 / holdings), so the ceilings bind at any breadth.
  sizing: relative
  zone_multiples:
    spring_loaded: 1.6
    fair: 1.15
    rich: 0.8
    expensive: 0.5
# Applied to gains the sleeve realizes when it rebalances, and to the position
# review. A weekly sleeve realizes almost everything short-term, which is what the
# after-tax equity curve is there to make visible.
tax_aware:
  enabled: true
  wait_days: 45          # defer a sale this close to long-term treatment...
  keep_multiple: 2.0     # ...but only while the name is still inside 2x top_k
  lot_method: hifo       # relieve highest-cost lots first
  wash_sales: true       # a repurchase within 30 days disallows the loss
tax:
  federal_long_term: 0.20
  federal_short_term: 0.37
  state: 0.0
  niit: 0.038
learning:
  temperature: 1.0
  hedge_eta: 0.03
  min_agent_weight: 0.05
  max_agent_weight: 0.50
backtest:
  frequency: weekly
  min_rebalances: 3
risk:
  max_drawdown_limit: -0.25
